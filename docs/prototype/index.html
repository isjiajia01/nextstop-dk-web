<!doctype html>
<html lang="da" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Næste web: layout prototype</title>
<!-- tokens.css, band.js, icons.js, data.js and ios-app.css are unmodified copies of the approved iOS prototype
     (~/Developer/apps/nextstop-dk/docs/prototype/assets). web.css + web.js are the web layer under review. -->
<link rel="stylesheet" href="assets/tokens.css">
<link rel="stylesheet" href="assets/ios-app.css">
<link rel="stylesheet" href="assets/web.css">
</head>
<body>
<a class="skip" href="#sheetBody">Gå til afgange</a>
<div id="app">
  <section class="sheet" id="sheet" aria-label="Afgange">
    <button class="grabber" id="grabber" aria-label="Arkhåndtag" data-act="toggle"></button>
    <div class="sheet-body" id="sheetBody" tabindex="-1"></div>
  </section>
  <section class="detail" id="detail" hidden aria-labelledby="jTitleCard"></section>
  <div class="map" id="map" aria-label="Kort over stoppesteder (illustrativt)">
    <div class="map-plane" id="mapPlane"></div>
    <div class="map-pins" id="mapPins"></div>
  </div>
  <div class="map-controls" id="mapControls">
    <button id="locBtn" class="is-on" aria-label="Vis min placering (demo)" title="Vis min placering"><svg viewBox="0 0 24 24" class="ico" aria-hidden="true"><path fill="currentColor" d="M20.6 3.4 3.9 10.6c-.8.4-.7 1.6.2 1.8l6.6 1.2 1.2 6.6c.2.9 1.4 1 1.8.2L20.6 3.4Z"/></svg></button>
    <button id="pitchBtn" class="t3d" aria-label="Skift mellem 2D og 3D" aria-pressed="false" title="2D / 3D">3D</button>
  </div>
  <button id="demoBtn" class="demo-btn" aria-expanded="false" aria-controls="demoPanel">Demodata · tilstande</button>
  <section class="demo-panel" id="demoPanel" hidden aria-label="Demotilstande"></section>
  <p class="map-legal" id="mapLegal"><span class="proto-tag">Illustrativt kort</span> <a href="https://openfreemap.org" target="_blank" rel="noopener">OpenFreeMap</a> © <a href="https://openmaptiles.org/" target="_blank" rel="noopener">OpenMapTiles</a> data fra <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> · <a href="https://maplibre.org/" target="_blank" rel="noopener">MapLibre</a></p>
  <div class="toast" id="toast" hidden role="status"></div>
</div>
<script src="assets/icons.js"></script>
<script src="assets/data.js"></script>
<script src="assets/band.js"></script>
<script src="assets/web.js"></script>
</body>
</html>
