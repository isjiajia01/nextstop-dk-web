name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pages-deploy
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # The public feed is about 53 MB. ubuntu-latest has unzip preinstalled for the shape generator.
      - name: Download optional GTFS feed (~53 MB)
        continue-on-error: true
        run: |
          curl -fsSL --retry 3 --retry-all-errors --connect-timeout 10 --max-time 180 \
            https://www.rejseplanen.info/labs/GTFS.zip -o "$RUNNER_TEMP/GTFS.zip.part" \
            && mv "$RUNNER_TEMP/GTFS.zip.part" "$RUNNER_TEMP/GTFS.zip"
      - run: npm run build
        env:
          VITE_API_BASE: https://nextstop-api.isjia.page
          GTFS_ZIP: ${{ runner.temp }}/GTFS.zip
      - name: Publish dist to gh-pages
        run: |
          printf '%s\n' 'nextstop.isjia.page' > dist/CNAME
          touch dist/.nojekyll
          cd dist
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
